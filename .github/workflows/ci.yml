name: Sylvia CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.15.2

      - name: Check formatting
        run: zig fmt --check src/ build.zig

      - name: Build project
        run: zig build

      - name: Test truncator
        run: zig test src/memory/truncator.zig

      - name: Test parser
        run: zig test src/llm/parser.zig

      - name: Test context
        run: zig test src/memory/context.zig
