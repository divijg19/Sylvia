name: Build and Release Sylvia

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-linux
            os_family: linux
            ext: ""
          - target: aarch64-linux
            os_family: linux
            ext: ""
          - target: x86_64-macos
            os_family: macos
            ext: ""
          - target: aarch64-macos
            os_family: macos
            ext: ""
          - target: x86_64-windows
            os_family: windows
            ext: ".exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.15.2

      - name: Build release binary
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Package release artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          bin_name="Sylvia${{ matrix.ext }}"
          archive_name="sylvia-${{ github.ref_name }}-${{ matrix.target }}"

          cp "zig-out/bin/${bin_name}" "${tmp_dir}/${bin_name}"
          cp README.md LICENSE "${tmp_dir}/"

          if [[ "${{ matrix.os_family }}" == "windows" ]]; then
            archive_path="${archive_name}.zip"
            (cd "${tmp_dir}" && zip -r "${GITHUB_WORKSPACE}/${archive_path}" .)
          else
            archive_path="${archive_name}.tar.gz"
            tar -czvf "${GITHUB_WORKSPACE}/${archive_path}" -C "${tmp_dir}" .
          fi

          echo "archive_path=${GITHUB_WORKSPACE}/${archive_path}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ steps.package.outputs.archive_path }}
